name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Compagnion version
      description: Compagnion → About Compagnion, e.g. 0.1.0 (136)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Both
        - Not related to an agent
  - type: textarea
    id: more
    attributes:
      label: Screenshots or logs
      description: Anything else that helps, such as a screenshot or the output of the agent.
